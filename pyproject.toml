[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bm-downloader"
version = "0.1.0"
description = "Periodic sync of Blackmagic camera clips to the SignCollect research drive"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bmcam-sync = "scripts.sync_clips:main"

[tool.setuptools]
packages = ["scripts"]

[tool.bmcam-sync]
staging-dir = 'E:\BlackmagicTemp'

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["*_test.py", "test_*.py"]
